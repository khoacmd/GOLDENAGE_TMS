# Triển khai production trên 1 VPS (amd64 hoặc arm64). Hướng dẫn: docs/DEPLOY.md
#   cd infra/prod && cp .env.example .env  (điền bí mật)
#   docker compose pull && docker compose up -d
name: tms-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  image: ${IMAGE_PREFIX:-ghcr.io/khoacmd}/tms-api:${TMS_VERSION:-latest}
  build:
    context: ../../backend
  restart: unless-stopped
  logging: *logging
  environment:
    TMS_ENV: prod
    TMS_DATABASE_URL: postgresql+asyncpg://tms_app:${TMS_APP_PASSWORD:?}@postgres:5432/tms
    TMS_MIGRATION_DATABASE_URL: postgresql+asyncpg://tms_owner:${TMS_OWNER_PASSWORD:?}@postgres:5432/tms
    TMS_JWT_SECRET: ${TMS_JWT_SECRET:?}
    TMS_REDIS_URL: redis://redis:6379/0
    TMS_S3_ENDPOINT: http://storage:8333
    TMS_S3_PUBLIC_ENDPOINT: ${PUBLIC_URL:?}
    TMS_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tms}
    TMS_S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    TMS_S3_BUCKET: ${TMS_S3_BUCKET:-tms-photos}
    TMS_CORS_ORIGINS: '["${PUBLIC_URL}"]'
    TMS_OSRM_CAR_URL: ${TMS_OSRM_CAR_URL:-}
    TMS_OSRM_MOTORBIKE_URL: ${TMS_OSRM_MOTORBIKE_URL:-}
    TMS_SENTRY_DSN: ${TMS_SENTRY_DSN:-}
    TMS_SENTRY_TRACES_SAMPLE_RATE: ${TMS_SENTRY_TRACES_SAMPLE_RATE:-0}
    TMS_ZALO_APP_ID: ${TMS_ZALO_APP_ID:-}
    TMS_ZALO_APP_SECRET: ${TMS_ZALO_APP_SECRET:-}
    TMS_ZALO_ACTIVATION_URL: ${TMS_ZALO_ACTIVATION_URL:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TMS_OWNER_PASSWORD: ${TMS_OWNER_PASSWORD:?}
      TMS_APP_PASSWORD: ${TMS_APP_PASSWORD:?}
      TZ: UTC
    volumes:
      - ${DATA_DIR:?}/postgres:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ${DATA_DIR}/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tms"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Ảnh chứng từ (S3). Cấu hình khóa sinh từ biến môi trường khi khởi động.
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    logging: *logging
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tms}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"tms","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - ${DATA_DIR}/seaweedfs:/data

  # Chạy migration rồi thoát; api/worker/scheduler chờ bước này xong.
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["dramatiq", "worker.tasks", "--processes", "1", "--threads", "1"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: *backend
    command: ["python", "-m", "worker.scheduler"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/khoacmd}/tms-web:${TMS_VERSION:-latest}
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      TMS_S3_BUCKET: ${TMS_S3_BUCKET:-tms-photos}
    volumes:
      - ${DATA_DIR}/tiles:/srv/tiles:ro
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy:/data
    depends_on: [web]

  # Public qua Cloudflare Tunnel (profile "tunnel"): không cần mở cổng/IP public.
  # Trên Cloudflare: Public hostname <tên-miền> → Service http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:2025.10.1
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ["routing"]
    restart: unless-stopped
    logging: *logging
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/vietnam.osrm
    volumes:
      - ${DATA_DIR}/osrm/car:/data:ro

  osrm-motorbike:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ["routing"]
    restart: unless-stopped
    logging: *logging
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/vietnam.osrm
    volumes:
      - ${DATA_DIR}/osrm/motorbike:/data:ro
