name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "55432"
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      TMS_OWNER_PASSWORD: tms_owner
      TMS_APP_PASSWORD: tms_app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Khởi tạo role & database
        run: bash ../infra/postgres/init/01-roles-and-databases.sh
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: API client khớp với OpenAPI của backend
        run: |
          (cd backend && uv sync --locked)
          pnpm api:generate
          git diff --exit-code packages/api-client
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter web build
